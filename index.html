<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nachtflug – eine Demo in Drachenhauch</title>
  <meta name="description" content="Nachtflug: Trance-Musik und Bilder, ganz in einem Programm erzeugt. Eine Demo in Drachenhauch von Hans Schnorrenberger." />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
                 font-family: Georgia, "Times New Roman", serif; color: #cfd8f0; }
    /* raylib schreibt die Groesse als Inline-Stil an die Leinwand; der Puffer
       bleibt 1280x720, angezeigt wird er eingepasst und mittig. */
    canvas#canvas { position: absolute; inset: 0; margin: auto;
                    width: min(100vw, calc(100vh * 16 / 9)) !important;
                    height: min(100vh, calc(100vw * 9 / 16)) !important;
                    background: #000; display: block; outline: none; }
    #start { position: absolute; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; cursor: pointer;
             background: radial-gradient(ellipse at 50% 60%, #14203a 0%, #05070d 70%);
             text-align: center; z-index: 2; }
    #start h1 { font-weight: normal; letter-spacing: 0.5em; font-size: clamp(28px, 6vw, 64px);
                margin: 0 0 0 0.5em; color: #e6ecff; }
    #start p { margin: 10px 0; color: #8fa0c8; font-size: clamp(13px, 1.8vw, 18px); }
    #start .knopf { margin-top: 28px; padding: 12px 28px; border: 1px solid #6f86c0;
                    border-radius: 999px; color: #e6ecff; font-size: 18px;
                    letter-spacing: 0.15em; }
    #start .klein { font-size: 13px; color: #6b7aa0; margin-top: 22px; }
    #start.laedt { cursor: progress; }
    #leiste { position: absolute; right: 12px; bottom: 10px; z-index: 3;
              display: flex; gap: 8px; opacity: 0.35; transition: opacity 0.3s; }
    #leiste:hover { opacity: 1; }
    #leiste button, #leiste a { background: rgba(10,14,26,0.8); color: #cfd8f0;
              border: 1px solid #3a4a70; border-radius: 6px; padding: 5px 10px;
              font: 13px system-ui, sans-serif; cursor: pointer; text-decoration: none; }
    #meldung { position: absolute; left: 12px; bottom: 10px; z-index: 3;
               font: 13px system-ui, sans-serif; color: #e0a0a0; white-space: pre-wrap;
               max-width: 70vw; }
    a { color: #9fb4e8; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720" tabindex="-1"
          oncontextmenu="event.preventDefault()"></canvas>

  <div id="start">
    <h1>NACHTFLUG</h1>
    <p>Trance in a-Moll, Ozean, Polarlicht, Galaxie – Musik und Bild aus einem Programm</p>
    <p>von Hans Schnorrenberger · geschrieben in <a href="https://github.com/HasoSchno70/Drachenhauch" onclick="event.stopPropagation()">Drachenhauch</a></p>
    <div class="knopf" id="knopf">▶&nbsp;&nbsp;Starten (mit Ton)</div>
    <p class="klein">rund drei Minuten · Kopfhörer empfohlen · lädt etwa 20 MB</p>
  </div>

  <div id="leiste">
    <button id="vollbild" title="Vollbild (F11)">⛶ Vollbild</button>
    <button id="nochmal" title="Neu laden und noch einmal">↻ Nochmal</button>
    <a href="https://github.com/HasoSchno70/Drachenhauch" target="_blank" rel="noopener">Drachenhauch</a>
    <a href="THIRD-PARTY-NOTICES.txt" target="_blank" rel="noopener">Lizenzen</a>
  </div>
  <div id="meldung"></div>

  <script>
  (function () {
    var start = document.getElementById("start");
    var knopf = document.getElementById("knopf");
    var meldung = document.getElementById("meldung");
    var bereit = false, gewuenscht = false, quelle = null;

    function zeige(t) { meldung.textContent += t + "\n"; }
    // Warnungen von raylib (Monitor-Abfragen gibt es im Browser nicht) nicht zeigen
    function ausgabe(t) { if (!/^WARNING:|^INFO:/.test(t)) zeige(t); }

    window.Module = {
      canvas: document.getElementById("canvas"),
      noInitialRun: true,
      print: ausgabe,
      printErr: ausgabe,
      onRuntimeInitialized: function () { bereit = true; vielleichtStarten(); }
    };

    fetch("program.dh", { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function (t) { quelle = t; vielleichtStarten(); })
      .catch(function (e) { zeige("program.dh fehlt: " + e.message); });

    function vielleichtStarten() {
      if (!gewuenscht || !bereit || quelle === null) return;
      start.style.display = "none";
      // Im Browser macht die Seite das Vollbild (Knopf unten rechts, F11 des
      // Browsers). SET_FULLSCREEN der Demo fragt nach der Groesse des
      // Bildschirms, die raylib im Browser nicht kennt, und verstellt dabei
      // den Zeichenpuffer -- je nach Bildschirm sah man nur einen Teil.
      quelle = quelle
        .replace("IF NOT imFenster THEN SET_FULLSCREEN(TRUE)", "' Vollbild: die Seite")
        .replace(/IF KEYHIT\(KEY_F11\) THEN SET_FULLSCREEN\([^\n]*/, "' F11: der Browser");
      try {
        Module.FS.writeFile("/program.dh", quelle);
        Module.callMain([]);
      } catch (e) {
        if (!(e && e.name === "ExitStatus")) zeige("" + e);
      }
      document.getElementById("canvas").focus();
    }

    start.addEventListener("click", function () {
      if (gewuenscht) return;
      gewuenscht = true;
      start.classList.add("laedt");
      knopf.textContent = bereit ? "startet …" : "lädt …";
      vielleichtStarten();
    });

    document.getElementById("vollbild").addEventListener("click", function () {
      var el = document.documentElement;
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen();
    });
    document.getElementById("nochmal").addEventListener("click", function () {
      location.reload();
    });

    var s = document.createElement("script");
    s.src = "dhrt.js";
    document.body.appendChild(s);
  })();
  </script>
</body>
</html>
